name: Pronostic diari de la Saligarda

# Dues execucions al dia, a proposit. El cron de GitHub no es puntual i es pot
# endarrerir forca minuts sota carrega; amb dos intents, si el primer falla o
# arriba tard, el segon el cobreix. El guard de 19_bot_x.R impedeix que es
# publiqui dos cops la mateixa nit, i el de frescor impedeix publicar una nit
# que ja hagi comencat.
#
# Hores UTC (GitHub no fa cas de l'horari d'estiu). Les primeres execucions
# reals van mostrar que el cron de GitHub s'endarrereix uns 2 h 25 min: el que
# es programava per a les 19:30 s'executava a les 21:50, a deu minuts del limit
# de frescor de les 22:00 UTC. Per aixo s'avancen les dues hores, de manera que
# amb el retard tipic caiguin cap a les 17:00 i les 19:30 UTC i quedin unes
# 2,5 h de marge per si algun dia el retard es mes gran.
on:
  schedule:
    - cron: "30 14 * * *"
    - cron: "0 17 * * *"
  workflow_dispatch:          # permet llancar-lo a ma des de la web
    inputs:
      nomes_prova:
        description: "Redactar sense publicar"
        type: boolean
        default: false
      verifica:
        description: "Nomes comprovar les credencials (no publica)"
        type: boolean
        default: false

permissions:
  contents: write             # per tornar a desar els registres al repositori

concurrency:                  # que dues execucions no es trepitgin els CSV
  group: pronostic
  cancel-in-progress: false

jobs:
  pronostic:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"
          use-public-rspm: true       # paquets binaris: instal.lacio en segons

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::data.table
            any::jsonlite
            any::httr
            any::ranger

      - name: Pronostic
        run: Rscript 16_pronostic.R

      - name: Publicar a X
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
        run: |
          if [ "${{ github.event.inputs.verifica }}" = "true" ]; then
            Rscript 19_bot_x.R --verifica
          elif [ "${{ github.event.inputs.nomes_prova }}" = "true" ]; then
            Rscript 19_bot_x.R --prova
          else
            Rscript 19_bot_x.R
          fi

      - name: Desar els registres
        run: |
          git config user.name  "bot-saligarda"
          git config user.email "bot-saligarda@users.noreply.github.com"
          git add derived/pronostics.csv derived/posts_x.csv pronostic.txt post_x.txt || true
          if git diff --staged --quiet; then
            echo "cap canvi a desar"
          else
            git commit -m "pronostic $(date -u +%Y-%m-%d)"
            # si una altra execucio ha escrit mentrestant, reintegra i torna-ho a provar
            for i in 1 2 3; do
              git pull --rebase --autostash && git push && break
              sleep 5
            done
          fi

      - name: Resum
        if: always()
        run: |
          echo "### Pronostic" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat post_x.txt >> $GITHUB_STEP_SUMMARY 2>/dev/null || echo "(no generat)" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
