name: Pronostic diari de la Saligarda

# Dues execucions al dia, a proposit. El cron de GitHub no es puntual i es pot
# endarrerir forca minuts sota carrega; amb dos intents, si el primer falla o
# arriba tard, el segon el cobreix. El guard de 19_bot_x.R impedeix que es
# publiqui dos cops la mateixa nit, i el de frescor impedeix publicar una nit
# que ja hagi comencat.
#
# Hores UTC (GitHub no fa cas de l'horari d'estiu).
#
# EL RETARD DEL CRON CREIX. Mesurat sobre les execucions reals: 3,6 h el
# 30/10/2026, 5,3 h l'1/11, i 7,1 i 9,2 h el 2/11. Aquell dia la primera
# passada va arrencar a les 20:06 UTC i el limit de frescor son les 20:00
# (21:00 locals a l'hivern): el post es va perdre per sis minuts.
#
# Per aixo el cron va a les 08:00 i les 12:00, que donen 12 i 8 hores de marge
# a l'hivern, i 11 i 7 a l'estiu. Si el retard torna a creixer, el que s'ha
# d'avancar es la primera.
#
# No s'avanca mes perque hi ha un cost: com mes aviat s'emet, mes llarg es el
# termini del model numeric que alimenta el pronostic, i pitjor es. Amb el
# cron a les 06:00 el post sortiria, els dies sense retard, catorze hores
# abans no comenci la nit. A les 08:00, i amb el retard habitual de 3 a 5
# hores, surt cap al migdia, que es a prop d'on era.
#
# Ja no hi ha cap limit dur d'hora. 16_pronostic.R calculava la nit objectiu
# amb un llindar fix de les 10 UTC, que obligava a no baixar d'alla; ara mira
# si les 21:00 locals d'ahir ja han passat, cosa que es correcta a qualsevol
# hora. El cron es pot avancar tant com calgui.
on:
  schedule:
    - cron: "0 8 * * *"
    - cron: "0 12 * * *"
  workflow_dispatch:          # permet llancar-lo a ma des de la web
    inputs:
      nomes_prova:
        description: "Redactar sense publicar"
        type: boolean
        default: false
      verifica:
        description: "Nomes comprovar les credencials (no publica)"
        type: boolean
        default: false

permissions:
  contents: write             # per tornar a desar els registres al repositori

concurrency:                  # que dues execucions no es trepitgin els CSV
  group: pronostic
  cancel-in-progress: false

jobs:
  pronostic:
    runs-on: ubuntu-latest
    # 20 minuts era massa just i es menjava tres nits (17 i 24 d'octubre i la
    # del 26). El pas setup-r-dependencies hi arribava pelat i, els dies que el
    # runner anava una mica mes lent, el job moria exactament als 20:00 amb els
    # paquets a mig instal.lar. I era un cercle visios: la memoria cau nomes es
    # desa si el job acaba be, de manera que cap passada no arribava a desar-la
    # i totes tornaven a compilar des de zero.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        id: r
        with:
          r-version: "release"
          use-public-rspm: true       # paquets binaris: instal.lacio en segons

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          # 'always' desa la memoria cau encara que el job no acabi be, que es
          # el que trenca el cercle visios descrit a timeout-minutes.
          cache: always
          # Nomes les dependencies dures. Amb el valor per defecte ("all") hi
          # entren les suggerides, que aqui no es fan servir i son justament
          # les que allarguen la instal.lacio.
          dependencies: '"hard"'
          packages: |
            any::data.table
            any::jsonlite
            any::httr
            any::ranger

      - name: Pronostic
        run: Rscript 16_pronostic.R

      - name: Publicar a X
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
        run: |
          if [ "${{ github.event.inputs.verifica }}" = "true" ]; then
            Rscript 19_bot_x.R --verifica
          elif [ "${{ github.event.inputs.nomes_prova }}" = "true" ]; then
            Rscript 19_bot_x.R --prova
          else
            Rscript 19_bot_x.R
          fi

      # always() perque la pagina s'ha de refer encara que el pronostic o la
      # publicacio a X hagin fallat. Pero nomes si R existeix: el 23/09/2026
      # setup-r va petar i aquest pas, amb always() tot sol, va fallar tambe
      # sense tenir-hi res a veure.
      - name: Pagina per al canal de WhatsApp
        if: always() && steps.r.conclusion == 'success'
        run: Rscript 20_whatsapp.R

      # if: always() a proposit. Si la publicacio a X falla (sense credits,
      # per exemple) el pronostic i la pagina del canal ja son fets i s'han
      # de desar igualment; altrament quedaria en linia el missatge d'ahir.
      - name: Desar els registres
        if: always()
        run: |
          git config user.name  "bot-saligarda"
          git config user.email "bot-saligarda@users.noreply.github.com"
          git add derived/pronostics.csv derived/pronostics_fins_*.csv derived/posts_x.csv pronostic.txt post_x.txt docs/index.html docs/missatge.txt || true
          if git diff --staged --quiet; then
            echo "cap canvi a desar"
          else
            git commit -m "pronostic $(date -u +%Y-%m-%d)"
            # si una altra execucio ha escrit mentrestant, reintegra i torna-ho a provar
            for i in 1 2 3; do
              git pull --rebase --autostash && git push && break
              sleep 5
            done
          fi

      # El resum de l'execucio porta les dues versions: la que ha anat a X i la
      # que s'ha d'enganxar al canal de WhatsApp. Aixi, obrint l'execucio des
      # del mobil ja es pot copiar sense passar per la pagina.
      - name: Resum
        if: always()
        run: |
          echo "### Publicat a X" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat post_x.txt >> $GITHUB_STEP_SUMMARY 2>/dev/null || echo "(no generat)" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "### Per enganxar al canal de WhatsApp" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat docs/missatge.txt >> $GITHUB_STEP_SUMMARY 2>/dev/null || echo "(no generat)" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Pagina amb boto de copiar: https://adriabarbeta.github.io/saligarda/" >> $GITHUB_STEP_SUMMARY
